<!DOCTYPE html>
<html lang="vi">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Call4me</title>

  <link
    rel="stylesheet"
    href="./styles/style.css"
  />

</head>

<body>

  <!-- =========================================
       BACKGROUND
  ========================================= -->

  <div class="bgBlob blob1"></div>
  <div class="bgBlob blob2"></div>
  <div class="bgBlob blob3"></div>

  <!-- =========================================
       TOP BAR
  ========================================= -->

  <header class="topBar">

    <div class="topLeft">

      <div class="appLogo">
        Call4me
      </div>

      <div class="roomInfo">

        <div class="roomLabel">
          Current Room
        </div>

        <div
          id="roomId"
          class="roomId"
        >
          loading...
        </div>

      </div>

    </div>

    <div class="topCenter">

      <div class="liveBadge">
        LIVE
      </div>

      <div class="participantInfo">

        👥
        <span id="participantCount">
          1
        </span>
        participants

      </div>

    </div>

    <div class="topRight">

      <button
        id="copyRoomBtn"
        class="topBtn"
      >
        📋 Copy Room
      </button>

      <button
        id="leaveBtn"
        class="topBtn danger"
      >
        ❌ Leave
      </button>

    </div>

  </header>

  <!-- =========================================
       MAIN LAYOUT
  ========================================= -->

  <main class="callLayout">

    <!-- =========================================
         PARTICIPANTS
    ========================================= -->

    <aside class="participantsPanel">

      <div class="panelTitle">
        Participants 👥
      </div>

      <div
        id="participantsList"
        class="participantsList"
      >

        <!-- SELF -->

        <div class="participantCard speaking">

          <div class="participantAvatar">
            😎
          </div>

          <div class="participantMeta">

            <div class="participantName">
              You
            </div>

            <div class="participantStatus">
              Speaking...
            </div>

          </div>

        </div>

      </div>

    </aside>

    <!-- =========================================
         VIDEO AREA
    ========================================= -->

    <section class="videoSection">

      <!-- MAIN VIDEO -->

      <div class="mainVideoCard">

        <video
          id="remoteVideo"
          autoplay
          playsinline
        ></video>

        <div class="videoOverlay">

          <div class="videoUser">

            🌐 Remote User

          </div>

          <div class="videoStatus">
            Connected
          </div>

        </div>

      </div>

      <!-- LOCAL VIDEO -->

      <div class="localVideoCard">

        <video
          id="localVideo"
          autoplay
          muted
          playsinline
        ></video>

        <div class="localLabel">
          You
        </div>

      </div>

      <!-- CONTROLS -->

      <div class="controlsBar">

        <button
          id="toggleMicBtn"
          class="controlBtn"
        >
          🎤
        </button>

        <button
          id="toggleCameraBtn"
          class="controlBtn"
        >
          📷
        </button>

        <button
          id="screenShareBtn"
          class="controlBtn"
        >
          🖥️
        </button>

        <button
          id="reactionBtn"
          class="controlBtn"
        >
          😎
        </button>

        <button
          id="chatToggleBtn"
          class="controlBtn"
        >
          💬
        </button>

      </div>

    </section>

    <!-- =========================================
         CHAT PANEL
    ========================================= -->

    <aside class="chatPanel">

      <div class="panelTitle">
        Live Chat 💬
      </div>

      <!-- CHAT MESSAGES -->

      <div
        id="chatMessages"
        class="chatMessages"
      >

        <div class="chatMessage self">

          <div class="chatAvatar">
            😎
          </div>

          <div class="chatBubble">
            Welcome to Call4me 🔥
          </div>

        </div>

      </div>

      <!-- TYPING -->

      <div
        id="typingIndicator"
        class="typingIndicator"
      >
        Someone is typing...
      </div>

      <!-- INPUT -->

      <div class="chatInputArea">

        <input
          id="chatInput"
          type="text"
          placeholder="Type message..."
        />

        <button
          id="sendBtn"
        >
          Send
        </button>

      </div>

    </aside>

  </main>

  <!-- =========================================
       REACTIONS
  ========================================= -->

  <div
    id="reactionContainer"
    class="reactionContainer"
  ></div>

  <!-- =========================================
       SCRIPTS
  ========================================= -->

  <script src="/socket.io/socket.io.js"></script>

  <script
    type="module"
    src="./rtc/socket.js"
  ></script>

  <script
    type="module"
    src="./rtc/webrtc.js"
  ></script>

  <script
    type="module"
    src="./rtc/ui.js"
  ></script>

</body>

</html>
