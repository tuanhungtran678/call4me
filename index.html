<!DOCTYPE html>
<html lang="vi">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Call4me</title>

  <link
    rel="stylesheet"
    href="style.css"
  />

</head>

<body>

  <!-- TOPBAR -->

  <div class="topbar">

    <div class="brand">

      <div class="logo">
        Call4me
      </div>

      <div class="room">
        Room:
        <span id="roomText"></span>
      </div>

    </div>

    <div class="topbarRight">

      <div class="onlineBox">

        <span class="onlineDot"></span>

        <span id="onlineCount">
          1 online
        </span>

      </div>

      <div
        class="username"
        id="username"
      ></div>

    </div>

  </div>

  <!-- MAIN -->

  <div class="mainLayout">

    <!-- VIDEO AREA -->

    <div
      class="videos"
      id="videoGrid"
    >

      <!-- LOCAL VIDEO -->

      <div
        class="videoBox local"
        id="localBox"
      >

        <video
          id="localVideo"
          autoplay
          muted
          playsinline
        ></video>

        <div class="videoOverlay">

          <div class="nameTag">
            You
          </div>

          <div class="videoActions">

            <button class="miniBtn">
              🎤
            </button>

            <button class="miniBtn">
              📷
            </button>

          </div>

        </div>

      </div>

      <!-- REMOTE VIDEOS GENERATED BY JS -->

    </div>

    <!-- CHAT SIDEBAR -->

    <div class="chatSidebar">

      <div class="chatHeader">

        <div>
          Chat
        </div>

        <div id="participantCount">
          1 participant
        </div>

      </div>

      <div
        class="messages"
        id="messages"
      >

        <div class="systemMessage">
          Welcome to Call4me 🔥
        </div>

      </div>

      <div class="typingBox">

        <span id="typingText"></span>

      </div>

      <div class="chatInputArea">

        <input
          type="text"
          id="messageInput"
          placeholder="Type a message..."
        />

        <button id="sendBtn">
          Send
        </button>

      </div>

    </div>

  </div>

  <!-- CONTROLS -->

  <div class="controls">

    <button
      class="controlBtn"
      id="micBtn"
    >
      🎤
    </button>

    <button
      class="controlBtn"
      id="camBtn"
    >
      📷
    </button>

    <button
      class="controlBtn"
      id="shareBtn"
    >
      🖥️
    </button>

    <button
      class="controlBtn"
      id="chatToggleBtn"
    >
      💬
    </button>

    <button
      class="controlBtn leave"
      id="leaveBtn"
    >
      ❌
    </button>

  </div>

  <!-- AUDIO -->

  <audio
    id="joinSound"
    src="sounds/join.mp3"
  ></audio>

  <audio
    id="leaveSound"
    src="sounds/leave.mp3"
  ></audio>

  <audio
    id="ringSound"
    src="sounds/ring.mp3"
  ></audio>

  <!-- SOCKET.IO -->

  <script src="/socket.io/socket.io.js"></script>

  <!-- SCRIPTS -->

  <script src="socket.js"></script>

  <script src="ui.js"></script>

  <script src="webrtc.js"></script>

  <script src="app.js"></script>

</body>

</html>
```
