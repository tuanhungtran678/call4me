<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Call4me</title>

  <link
    rel="stylesheet"
    href="style.css"
  />
</head>

<body>

  <div class="topbar">

    <div>
      <div class="logo">
        Call4me
      </div>

      <div class="room">
        Room:
        <span id="roomText"></span>
      </div>
    </div>

    <div id="username"></div>

  </div>

  <div class="videos">

    <div class="videoBox">

      <video
        id="localVideo"
        autoplay
        muted
        playsinline
      ></video>

      <div class="nameTag">
        You
      </div>

    </div>

    <div class="videoBox">

      <video
        id="remoteVideo"
        autoplay
        playsinline
      ></video>

      <div class="nameTag">
        Remote User
      </div>

    </div>

  </div>

  <div class="controls">

    <button
      class="controlBtn"
      id="micBtn"
    >
      🎤
    </button>

    <button
      class="controlBtn"
      id="camBtn"
    >
      📷
    </button>

    <button
      class="controlBtn"
      id="shareBtn"
    >
      🖥️
    </button>

    <button
      class="controlBtn leave"
      onclick="location.reload()"
    >
      ❌
    </button>

  </div>

  <audio
    id="joinSound"
    src="sounds/join.mp3"
  ></audio>

  <audio
    id="leaveSound"
    src="sounds/leave.mp3"
  ></audio>

  <script src="/socket.io/socket.io.js"></script>

  <script src="webrtc.js"></script>

  <script src="app.js"></script>

</body>

</html>
