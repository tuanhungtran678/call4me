<!DOCTYPE html>
<html lang="vi">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Call4me</title>

  <link
    rel="stylesheet"
    href="style.css"
  />

</head>

<body>

  <!-- TOP BAR -->

  <div class="topBar">

    <div class="leftTop">

      <div class="logo">
        Call4me
      </div>

      <div
        class="roomText"
        id="roomText"
      >
        room
      </div>

    </div>

    <div class="rightTop">

      <!-- USER -->

      <div class="userProfile">

        <img
          id="userAvatar"
          class="userAvatar"
          src=""
          alt="avatar"
        />

        <div class="userInfo">

          <div
            id="username"
            class="username"
          >
            User
          </div>

          <div
            id="onlineCount"
            class="onlineCount"
          >
            online
          </div>

        </div>

      </div>

      <!-- LOGOUT -->

      <button
        id="logoutBtn"
        class="logoutBtn"
      >
        Logout
      </button>

    </div>

  </div>

  <!-- MAIN -->

  <div class="mainLayout">

    <!-- VIDEOS -->

    <div
      class="videoGrid"
      id="videoGrid"
    >

      <!-- LOCAL -->

      <div class="videoBox">

        <video
          id="localVideo"
          autoplay
          muted
          playsinline
        ></video>

        <div class="videoOverlay">

          <div class="nameTag">
            You
          </div>

        </div>

      </div>

    </div>

    <!-- CHAT -->

    <div class="chatPanel">

      <!-- HEADER -->

      <div class="chatHeader">

        <div>
          Chat 💬
        </div>

        <div
          id="participantCount"
        >
          1 participant
        </div>

      </div>

      <!-- MESSAGES -->

      <div
        class="messages"
        id="messages"
      ></div>

      <!-- TYPING -->

      <div
        id="typingText"
        class="typingText"
      ></div>

      <!-- INPUT -->

      <div class="chatInputArea">

        <input
          type="text"
          id="messageInput"
          placeholder="Type a message..."
        />

        <button
          id="sendBtn"
        >
          Send
        </button>

      </div>

    </div>

  </div>

  <!-- CONTROLS -->

  <div class="controls">

    <button
      id="micBtn"
      class="controlBtn"
    >
      🎤
    </button>

    <button
      id="camBtn"
      class="controlBtn"
    >
      📷
    </button>

    <button
      id="shareBtn"
      class="controlBtn"
    >
      🖥️
    </button>

    <button
      id="leaveBtn"
      class="controlBtn leave"
    >
      ❌
    </button>

  </div>

  <!-- SCRIPTS -->

  <script
    type="module"
    src="firebase.js"
  ></script>

  <script src="socket.js"></script>

  <script src="webrtc.js"></script>

  <script src="ui.js"></script>

  <script
    type="module"
    src="app.js"
  ></script>

</body>

</html>
