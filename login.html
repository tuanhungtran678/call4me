<!DOCTYPE html>
<html lang="vi">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Call4me Login</title>

  <link
    rel="stylesheet"
    href="auth.css"
  />

</head>

<body>

  <!-- BACKGROUND -->

  <div class="bgBlur bg1"></div>
  <div class="bgBlur bg2"></div>
  <div class="bgBlur bg3"></div>

  <!-- LOGIN CARD -->

  <div class="loginContainer">

    <!-- LOGO -->

    <div class="logo">
      Call4me
    </div>

    <div class="subtitle">
      Realtime communication platform 🔥
    </div>

    <!-- LOGIN BUTTONS -->

    <div class="loginButtons">

      <!-- GOOGLE -->

      <button
        class="loginBtn google"
        id="googleLogin"
      >

        <span class="icon">
          🌐
        </span>

        <span>
          Continue with Google
        </span>

      </button>

      <!-- GITHUB -->

      <button
        class="loginBtn github"
        id="githubLogin"
      >

        <span class="icon">
          💻
        </span>

        <span>
          Continue with GitHub
        </span>

      </button>

    </div>

    <!-- LOADING -->

    <div
      class="loading"
      id="loadingText"
    >
      Connecting...
    </div>

    <!-- FOOTER -->

    <div class="footer">

      Powered by
      Firebase + WebRTC + Socket.IO 🔥

    </div>

  </div>

  <!-- AUTH -->

  <script
    type="module"
    src="auth.js"
  ></script>

</body>

</html>
