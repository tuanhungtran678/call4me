<!DOCTYPE html>

<html lang="vi">
<head>

  <meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

  <title>Call4me Settings</title>

  <link
    rel="stylesheet"
    href="./settings.css"
  >

</head>
<body>

  <div class="container">

<div class="card">

  <h1>
    ⚙ Settings
  </h1>

  <img
    id="avatarPreview"
    src="https://ui-avatars.com/api/?name=User"
    alt="Avatar"
  >

  <input
    id="displayName"
    type="text"
    placeholder="Tên hiển thị"
  >

  <input
    id="callNumber"
    type="text"
    readonly
  >

  <button id="generateBtn">
    🎲 Generate New Number
  </button>

  <button id="saveBtn">
    💾 Save
  </button>

  <button id="backBtn">
    ⬅ Back
  </button>

</div>

  </div>

  <script
    type="module"
    src="./settings.js"
  ></script>

</body>
</html>
