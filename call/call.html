<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Call4me Call</title>

  <link
    rel="stylesheet"
    href="./call.css"
  >
</head>
<body>

  <div class="call-screen">

    <img
      id="avatar"
      src="https://ui-avatars.com/api/?name=User"
    >

    <h1 id="callerName">
      Incoming Call
    </h1>

    <p id="callStatus">
      Connecting...
    </p>

    <div class="controls">

      <button id="muteBtn">
        🎤
      </button>

      <button id="cameraBtn">
        📹
      </button>

      <button id="endBtn">
        📞 End
      </button>

    </div>

  </div>

  <script src="./call.js"></script>

</body>
</html>
