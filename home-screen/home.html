<!DOCTYPE html>
<html lang="vi">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Call4me Home</title>

  <link
    rel="stylesheet"
    href="./home.css"
  >

</head>

<body>

  <!-- BACKGROUND -->

  <div class="blob blob1"></div>
  <div class="blob blob2"></div>

  <!-- SIDEBAR -->

  <aside class="sidebar">

    <div class="logo">
      🚀 Call4me
    </div>

    <nav>

      <button class="navBtn active">
        🏠 Home
      </button>

      <button class="navBtn">
        👥 Friends
      </button>

      <button class="navBtn">
        💬 Messages
      </button>

      <button class="navBtn">
        📞 Calls
      </button>

      <button class="navBtn">
        ⚙ Settings
      </button>

    </nav>

  </aside>

  <!-- MAIN -->

  <main class="main">

    <!-- PROFILE -->

    <section class="profileCard">

      <img
        id="userAvatar"
        src=""
        alt="Avatar"
      >

      <div>

        <h2 id="displayName">
          Loading...
        </h2>

        <p id="email">
          Loading...
        </p>

        <span class="onlineBadge">
          🟢 Online
        </span>

      </div>

    </section>

    <!-- QUICK ACTIONS -->

    <section class="quickActions">

      <button id="createRoomBtn">
        🎥 Create Room
      </button>

      <button id="joinRoomBtn">
        🔗 Join Room
      </button>

      <button id="friendsBtn">
        👥 Friends
      </button>

    </section>

    <!-- STATS -->

    <section class="statsGrid">

      <div class="statCard">

        <h3>
          Rooms
        </h3>

        <p>
          0
        </p>

      </div>

      <div class="statCard">

        <h3>
          Friends
        </h3>

        <p>
          0
        </p>

      </div>

      <div class="statCard">

        <h3>
          Messages
        </h3>

        <p>
          0
        </p>

      </div>

    </section>

    <!-- RECENT -->

    <section class="recentCard">

      <h2>
        Recent Activity
      </h2>

      <div class="activity">

        🚀 Welcome to Call4me

      </div>

      <div class="activity">

        🎉 Account connected

      </div>

    </section>

    <!-- LOGOUT -->

    <button
      id="logoutBtn"
      class="logoutBtn"
    >
      🚪 Đăng xuất
    </button>

  </main>

  <script
    type="module"
    src="./home.js"
  ></script>

</body>

</html>
